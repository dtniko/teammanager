services:
  # Applicazione Sport Manager
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sportclub-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-your_super_secure_jwt_secret_key_minimum_32_characters_long}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your_google_client_id}
      FRONTEND_URL: http://localhost:8000
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DOCUMENTS_BUCKET: ${SUPABASE_DOCUMENTS_BUCKET:-documents}
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8000:5000"
    networks:
      - sportclub_network

networks:
  sportclub_network:
    driver: bridge
