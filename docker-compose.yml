services:
  # Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: sportclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sportclub_manager}
      POSTGRES_USER: ${DB_USER:-sportclub_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sportclub_network

  # Applicazione SportClub Manager
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sportclub-app
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sportclub_manager}
      DB_USER: ${DB_USER:-sportclub_user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-your_super_secure_jwt_secret_key_minimum_32_characters_long}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your_google_client_id}
      FRONTEND_URL: http://localhost:8000
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8000:5000"
    depends_on:
      - postgres
    networks:
      - sportclub_network

volumes:
  postgres_data:

networks:
  sportclub_network:
    driver: bridge
